<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeke Tetris Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Bungee+Shade&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      overflow: hidden;
      background-color: #1a1a1a;
      color: #fff;
    }
    .banner {
      width: 100%;
      background: linear-gradient(90deg, #ff007f, #7f00ff);
      text-align: center;
      padding: 30px 0;
      box-shadow: 0 6px 20px rgba(255,0,127,0.5);
      position: relative;
    }
    .banner h1 {
      margin: 0;
      font-family: 'Rubik Glitch', cursive;
      font-size: 4.5rem;
      color: #fff;
      letter-spacing: 4px;
      text-shadow: 3px 3px #00ffff, -3px -3px #ff007f;
    }

    /* Discreet Stats Header */
    .live-stats {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 14px;
      color: #00ffff;
      text-align: right;
      font-family: monospace;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
    }

    .main-layout {
      display: flex;
      flex: 1;
      width: 100%;
      justify-content: space-between;
      align-items: stretch;
      overflow: hidden;
    }
    .left-sidebar, .right-sidebar {
      width: 280px;
      background-color: #222;
      padding: 20px;
      box-sizing: border-box;
      border-left: 2px solid #333;
      border-right: 2px solid #333;
      overflow-y: auto;
      height: 100%;
    }
    .left-sidebar h3, .right-sidebar h3 {
      text-align: center;
      color: #00ffff;
      font-family: 'Bungee Shade', cursive;
      font-size: 1.1rem;
    }

    .upgrade-box {
      background: linear-gradient(135deg, #2c3e50, #3498db);
      border: 2px solid #00ffff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(0,255,255,0.2);
    }
    .upgrade-box button {
      background-color: #ff007f;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .upgrade-box button:hover {
      background-color: #00ffff;
      color: #1a1a1a;
    }
    .upgrade-box p {
      margin: 8px 0 0 0;
      font-size: 0.85rem;
      text-align: right;
      color: #f1c40f;
    }

    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    /* Tetris Canvas Container */
    #tetris-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #111;
      border: 2px solid #ff007f;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(255,0,127,0.4);
    }
    #tetrisCanvas {
      background: #000;
      border: 2px solid #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
      display: block;
    }
    .tetris-btn {
      background-color: #ff007f;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .tetris-btn:hover {
      background-color: #00ffff;
      color: #1a1a1a;
    }

    /* =========================================
       DISCREET ARCADE CSS (Retained from template)
       ========================================= */
    #arcade-trigger {
      position: fixed;
      bottom: 15px;
      right: 15px;
      font-size: 28px;
      opacity: 0.15;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.2s;
      z-index: 999;
    }
    #arcade-trigger:hover {
      opacity: 1;
      transform: scale(1.1);
      text-shadow: 0 0 10px #ff007f;
    }

    #arcade-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: none; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .arcade-content {
      background: #111;
      border: 2px solid #ff007f;
      border-radius: 12px;
      padding: 20px;
      width: 350px;
      box-shadow: 0 0 30px rgba(255,0,127,0.5);
      text-align: center;
    }
    .arcade-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="banner">
    <h1>Zeke's Tetris</h1>
    <div class="live-stats">
      Score: <span id="stat-score">0</span><br>
      Lines: <span id="stat-lines">0</span>
    </div>
  </div>

  <div class="main-layout">
    <div class="left-sidebar">
      <h3>Controls</h3>
      <div class="upgrade-box">
        <p style="text-align: left; color: #00ffff;">⬅ ➡ : Move Left/Right</p>
        <p style="text-align: left; color: #00ffff;">⬆ : Rotate Piece</p>
        <p style="text-align: left; color: #00ffff;">⬇ : Soft Drop</p>
      </div>
    </div>

    <div class="game-container">
      <div id="tetris-wrapper">
        <canvas id="tetrisCanvas" width="200" height="400"></canvas>
        <button class="tetris-btn" onclick="startTetrisGame()">Start Game</button>
      </div>
    </div>

    <div class="right-sidebar">
      <h3>Stats</h3>
      <p>High Score: <span id="stat-highscore">0</span></p>
      <p>Level: <span id="stat-level">1</span></p>
    </div>
  </div>

  <!-- Discreet Arcade Button -->
  <div id="arcade-trigger" onclick="toggleArcade(true)" title="Arcade Info">🎮</div>

  <!-- Arcade Modal -->
  <div id="arcade-modal">
    <div class="arcade-content">
      <div class="arcade-header">
        <span style="color: #00ffff; font-family: 'Bungee Shade';">Zeke Arcade</span>
        <button onclick="toggleArcade(false)" style="background:none; border:none; color:#ff007f; font-size:18px; cursor:pointer;">✖</button>
      </div>
      <p style="color: #ccc; font-size: 14px;">Welcome to Zeke Tetris! Clear lines to gain score and level up. Every block is made of Zeke.</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetrisCanvas');
    const ctx = canvas.getContext('2d');
    const BLOCK_SIZE = 20; 
    const ROWS = 20;
    const COLS = 10;

    let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let tetrisInterval = null;
    let score = 0;
    let totalLines = 0;
    let highscore = 0;
    let level = 1;
    let dropInterval = 500;

    // Load Zeke image for individual block segments
    const zekeBlockImg = new Image();
    zekeBlockImg.src = 'zeke.jpg';

    const SHAPES = [
      [[1,1,1,1]], // I
      [[1,1],[1,1]], // O
      [[0,1,0],[1,1,1]], // T
      [[1,0,0],[1,1,1]], // L
      [[0,0,1],[1,1,1]], // J
      [[0,1,1],[1,1,0]], // S
      [[1,1,0],[0,1,1]]  // Z
    ];

    let currentPiece = null;

    function createPiece() {
      const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return {
        shape: shape,
        x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
        y: 0
      };
    }

    function drawBoard() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw locked board pieces
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c]) {
            drawImageBlock(c, r);
          }
        }
      }

      // Draw active falling piece
      if (currentPiece) {
        currentPiece.shape.forEach((row, rIdx) => {
          row.forEach((val, cIdx) => {
            if (val) {
              drawImageBlock(currentPiece.x + cIdx, currentPiece.y + rIdx);
            }
          });
        });
      }
    }

    function drawImageBlock(x, y) {
      if (zekeBlockImg.complete && zekeBlockImg.naturalHeight !== 0) {
        ctx.drawImage(zekeBlockImg, x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        ctx.strokeStyle = '#ff007f';
        ctx.lineWidth = 1;
        ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
      } else {
        // Fallback color block if image doesn't load
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
      }
    }

    function collide(piece, offsetX, offsetY) {
      for (let r = 0; r < piece.shape.length; r++) {
        for (let c = 0; c < piece.shape[r].length; c++) {
          if (piece.shape[r][c]) {
            let newX = piece.x + c + offsetX;
            let newY = piece.y + r + offsetY;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && board[newY][newX]) return true;
          }
        }
      }
      return false;
    }

    function mergePiece() {
      currentPiece.shape.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val && currentPiece.y + r >= 0) {
            board[currentPiece.y + r][currentPiece.x + c] = 1;
          }
        });
      });
    }

    function clearLines() {
      let linesCleared = 0;
      outer: for (let r = ROWS - 1; r >= 0; r--) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c]) continue outer;
        }
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(0));
        linesCleared++;
        r++; 
      }
      if (linesCleared > 0) {
        totalLines += linesCleared;
        score += linesCleared * 100 * level;
        level = Math.floor(totalLines / 5) + 1;
        
        if (score > highscore) highscore = score;

        updateStats();
        adjustSpeed();
      }
    }

    function adjustSpeed() {
      if (tetrisInterval) clearInterval(tetrisInterval);
      dropInterval = Math.max(100, 500 - (level - 1) * 50);
      tetrisInterval = setInterval(movePieceDown, dropInterval);
    }

    function movePieceDown() {
      if (!collide(currentPiece, 0, 1)) {
        currentPiece.y++;
      } else {
        mergePiece();
        clearLines();
        currentPiece = createPiece();
        if (collide(currentPiece, 0, 0)) {
          // Game Over condition
          clearInterval(tetrisInterval);
          tetrisInterval = null;
          alert("Game Over! Final Score: " + score);
          board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
          score = 0;
          totalLines = 0;
          level = 1;
          updateStats();
        }
      }
      drawBoard();
    }

    function rotatePiece() {
      const originalShape = currentPiece.shape;
      const rotated = currentPiece.shape[0].map((_, index) =>
        currentPiece.shape.map(row => row[index]).reverse()
      );
      currentPiece.shape = rotated;
      if (collide(currentPiece, 0, 0)) {
        currentPiece.shape = originalShape; 
      }
      drawBoard();
    }

    function startTetrisGame() {
      if (tetrisInterval) clearInterval(tetrisInterval);
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      totalLines = 0;
      level = 1;
      updateStats();
      currentPiece = createPiece();
      drawBoard();
      tetrisInterval = setInterval(movePieceDown, dropInterval);
    }

    function updateStats() {
      document.getElementById('stat-score').innerText = score;
      document.getElementById('stat-lines').innerText = totalLines;
      document.getElementById('stat-highscore').innerText = highscore;
      document.getElementById('stat-level').innerText = level;
    }

    function toggleArcade(show) {
      document.getElementById('arcade-modal').style.display = show ? 'flex' : 'none';
    }

    // Keyboard controls
    window.addEventListener('keydown', e => {
      if (!tetrisInterval) return; // Don't move if game hasn't started
      if (e.key === 'ArrowLeft' && !collide(currentPiece, -1, 0)) {
        currentPiece.x--;
        drawBoard();
      } else if (e.key === 'ArrowRight' && !collide(currentPiece, 1, 0)) {
        currentPiece.x++;
        drawBoard();
      } else if (e.key === 'ArrowDown') {
        movePieceDown();
      } else if (e.key === 'ArrowUp') {
        rotatePiece();
      }
    });

    // Initial render setup
    drawBoard();
  </script>
</body>
</html>
